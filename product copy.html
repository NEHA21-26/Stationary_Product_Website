<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stationery Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensures full page height */
        }
        .navbar {
            background-color: #007BFF;
            padding: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
        .products-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 100px 20px 20px; /* Adjust for fixed navbar */
            width: 100%;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
            max-width: 1400px; /* Ensures grid doesn't stretch too wide */
            margin: auto;
        }
        .product {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .product img {
            width: 300px; /* Increased image size */
            height: 300px; /* Increased image size */
            border-radius: 5px;
            object-fit: cover;
            display: block;
            margin: auto;
        }
        .product p {
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .buy-btn {
            background-color: #ff9900;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }
        .buy-btn:hover {
            background-color: #cc7a00;
        }
    </style>
</head>
<body>
    <div class="navbar">Stationery Store</div>
    <div class="products-container">
        <h2>Stationery Products</h2>
        <div class="product-grid">
            <div class="product">

            <div class="product">

            <div class="product">

            <div class="product">

</body>
</html>
