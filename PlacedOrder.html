<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .navbar {
            background-color: #007BFF;
            padding: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        .order-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            margin: auto;
            text-align: left;
            margin-top: 50px;
        }
        .order-container h2 {
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .order-btn {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .order-btn:hover {
            background-color: #218838;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
            width: 50%;
            text-align: center;
            animation: slide-in 0.5s ease-in-out;
        }
        @keyframes slide-in {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .continue-btn {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .continue-btn:hover {
            background-color: #0056b3;
        }
        #cardNumberGroup {
            display: none;
        }
    </style>
</head>
<body>
    <div class="navbar">Stationery Store - Order Booking</div>
    <div class="order-container">
        <h2>Order Details</h2>
        <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        <div class="input-group">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter delivery address">
        </div>
        <div class="input-group">
            <label for="contact">Contact Number</label>
            <input type="text" id="contact" placeholder="Enter contact number">
        </div>
        <div class="input-group">
            <label for="payment">Payment Method</label>
            <select id="payment" onchange="toggleCardNumber()">
                <option value="">Select Payment Method</option>
                <option value="credit_card">Credit Card</option>
                <option value="debit_card">Debit Card</option>
                <option value="upi">UPI</option>
                <option value="cod">Cash on Delivery</option>
            </select>
        </div>
        <div class="input-group" id="cardNumberGroup">
            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" placeholder="Enter your card number">
        </div>
        <button class="order-btn" onclick="confirmOrder()">Place Order</button>
    </div>
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h2>🎉 Order Placed Successfully!</h2>
            <p>Thank you for shopping with us! Your order will be delivered soon.</p>
            <p><strong>Order ID:</strong> #ST123456</p>
            <p><strong>Payment Mode:</strong> <span id="paymentMode"></span></p>
            <a href="product.html"><button class="continue-btn">Continue Shopping</button></a>
            <button class="continue-btn" onclick="showOrderDetails()">See Your Order Details</button>
        </div>
    </div>
    <div id="orderDetailsModal" class="modal">
        <div class="modal-content">
            <h2>Your Order Details</h2>
            <form>
                <div class="input-group">
                    <label>Full Name:</label>
                    <input type="text" id="orderName" readonly>
                </div>
                <div class="input-group">
                    <label>Address:</label>
                    <input type="text" id="orderAddress" readonly>
                </div>
                <div class="input-group">
                    <label>Contact Number:</label>
                    <input type="text" id="orderContact" readonly>
                </div>
                <div class="input-group">
                    <label>Payment Mode:</label>
                    <input type="text" id="orderPayment" readonly>
                </div>
                <div class="input-group" id="orderCardGroup" style="display: none;">
                    <label>Card Number:</label>
                    <input type="text" id="orderCardNumber" readonly>
                </div>
            </form>
            <button class="continue-btn" onclick="closeOrderDetailsModal()">Close</button>
        </div>
    </div>
    <script>
        function toggleCardNumber() {
            var paymentMethod = document.getElementById("payment").value;
            var cardNumberGroup = document.getElementById("cardNumberGroup");

            if (paymentMethod === "credit_card" || paymentMethod === "debit_card") {
                cardNumberGroup.style.display = "block";
            } else {
                cardNumberGroup.style.display = "none";
            }
        }

        function confirmOrder() {
            document.getElementById("orderModal").style.display = "block";
            document.getElementById("paymentMode").innerText = document.getElementById("payment").value.replace("_", " ").toUpperCase();
        }

        function showOrderDetails() {
            document.getElementById("orderName").value = document.getElementById("name").value;
            document.getElementById("orderAddress").value = document.getElementById("address").value;
            document.getElementById("orderContact").value = document.getElementById("contact").value;
            document.getElementById("orderPayment").value = document.getElementById("payment").value.replace("_", " ").toUpperCase();
            var orderCardGroup = document.getElementById("orderCardGroup");
            if (document.getElementById("payment").value === "credit_card" || document.getElementById("payment").value === "debit_card") {
                document.getElementById("orderCardNumber").value = document.getElementById("cardNumber").value;
                orderCardGroup.style.display = "block";
            }
            document.getElementById("orderDetailsModal").style.display = "block";
        }

        function closeOrderDetailsModal() {
            document.getElementById("orderDetailsModal").style.display = "none";
        }
    </script>
</body>
</html>
