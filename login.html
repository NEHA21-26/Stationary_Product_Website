<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            background-image: url(/Images/allstat.jpg);
        }
        .navbar {
            background-color: #007BFF;
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: rgb(99, 116, 134);
            padding: 40px; /* Increased padding */
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
            width: 600px; /* Increased width */
            height: 500px; /* Increased height */
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 25px;
            font-size: 26px; /* Increased heading size */
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 18px; /* Increased label size */
        }
        .input-group input {
            width: 100%;
            padding: 14px; /* Increased input size */
            font-size: 18px; /* Increased font size */
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-btn {
            background-color: #ff9900;
            color: white;
            padding: 14px;
            font-size: 20px; /* Increased button size */
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            background-color: #cc7a00;
        }
        h2{
            background-color: darkblue;
            padding: 20px 0 20px 0;
        }
    </style>
</head>
<body>
    <div class="navbar">Stationery Store</div>
    <div class="container">
        <div class="login-container" id="login-page">
            <h2>Login</h2><br>
            <div class="input-group">
                <label for="mobile">Mobile Number</label>
                <input type="text" id="mobile" placeholder="Enter mobile number">
            </div>
            <br>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <br>
            <button class="login-btn" onclick="login()">Login</button><br><br><br><br>
            <a href="ForgotPass.html">Forgot Password</a>
        </div>
    </div>
   
    <script>
        function login() {
            let mobile = document.getElementById("mobile").value;
            let password = document.getElementById("password").value;
            
            if (mobile === "" || password === "") {
                alert("Please fill all fields");
                return;
            }
            
            alert("Login Successful!");
            window.location.href = "product.html"; // Redirect to product page
        }
    </script>
</body>
</html>
